server:
  port: 8320
  servlet:
    session:
      # 第 15 轮方案 A：默认 30 分钟就过期，配合持久登录 cookie 一起用，一个工作时段内不再被踢回登录框
      timeout: 8h

spring:
  application:
    name: preflight
  datasource:
    # 系统自身元数据库（SQLite 单文件；data/ 与 logs/ 都按相对路径解析，
    # 所以 dev\bin\start.bat 拉起 java 前会先 cd 到工作区根——data/ 与 logs/ 必须留在根上）
    # N21：WAL 模式允许"一写多读"并行（学习等长任务期间界面不再排队）；busy_timeout 兜底瞬时写冲突。
    # 备份时仍只需拷 preflight.db（正常停服会 checkpoint），热拷时请连 -wal/-shm 一起拷。
    url: jdbc:sqlite:data/preflight.db?journal_mode=WAL&busy_timeout=5000
    driver-class-name: org.sqlite.JDBC
    hikari:
      # WAL 后读不再被单连接排队卡死：池放宽到 5，写冲突由 busy_timeout 消化
      maximum-pool-size: 5
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      # 知识包=整项目知识+源码片段快照，真实项目实测 3.6MB 起（第十二轮：导入 413 的真因是 Spring 默认 1MB 上限）
      max-file-size: 200MB
      max-request-size: 200MB
  web:
    resources:
      # 前端静态资源每次条件 revalidate：避免升级后浏览器用启发式缓存跑旧 UI
      cache:
        period: 0
        cachecontrol:
          no-cache: true
          must-revalidate: true
  jackson:
    default-property-inclusion: non_null

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  file:
    name: logs/preflight.log
  level:
    com.preflight: INFO

preflight:
  samples-dir: ./samples
